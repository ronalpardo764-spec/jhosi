<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Universo de Jhoselin ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    #ui-top {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }
    #ui-top p {
      font-size: 13px;
      color: #fff;
      opacity: 0.9;
      margin: 0;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
    }

    /* Menú lateral derecho */
    #sidebar-menu {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #sidebar-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #sidebar-menu li {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
    }
    #sidebar-menu li:hover {
      color: #ff4081;
    }

    /* Corazón central resplandeciente */
    .heart-container {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
      text-align: center;
      z-index: 4;
    }
    .heart-shape {
      display: inline-block;
      font-size: 80px;
      color: #ffe680;
      text-shadow: 
        0 0 10px #ffcc00, 
        0 0 20px #ffaa00, 
        0 0 40px #ff3300, 
        0 0 80px #ff0055;
      animation: pulse 1.8s infinite ease-in-out;
      line-height: 1;
    }
    .heart-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 8px #000, 0 0 15px #ff0055;
      white-space: nowrap;
    }

    /* Etiquetas de los planetas */
    .label {
      position: absolute;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 6px #000, 0 0 10px #ff4081;
      transform: translate(-50%, -100%);
      text-align: center;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.95; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-top">
    <p>(Gira y acerca la pantalla para explorar los planetas) ✨</p>
  </div>

  <div id="sidebar-menu">
    <ul>
      <li>☰ Menu</li>
      <li>❤️ Dentrollar</li>
      <li>☉ Planeta</li>
      <li>📈 Shomesagos</li>
      <li>💬 Sensamenientos</li>
      <li>➭ Activitios</li>
      <li>⚙ Margueta</li>
      <li>↪ Log out</li>
    </ul>
  </div>

  <div id="labels-container"></div>

  <div id="heart-ui" class="heart-container">
    <div class="heart-shape">🤍</div>
    <div class="heart-text">¡TE AMO<br>JHOseLín! ❤️</div>
  </div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 16, 28);
    controls.update();

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 120);
    scene.add(sunLight);

    // Fondo Estrellado
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 4000;
    const starPos = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      starPos[i] = (Math.random() - 0.5) * 300;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    scene.add(new THREE.Points(starsGeo, starsMat));

    // Cargar la foto enviada como textura del sol
    const textureLoader = new THREE.TextureLoader();
    const imageName = "WhatsApp Image 2026-08-27 at 3.22.48 PM-convertido-de-jpeg.jpg";
    const sunTexture = textureLoader.load(imageName);

    // Esfera central con la imagen
    const sunGeo = new THREE.SphereGeometry(3.2, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Halos de brillo alrededor de la foto
    const glow1 = new THREE.Mesh(
      new THREE.SphereGeometry(3.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffea80, transparent: true, opacity: 0.35 })
    );
    scene.add(glow1);

    const glow2 = new THREE.Mesh(
      new THREE.SphereGeometry(5.0, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff9900, transparent: true, opacity: 0.15 })
    );
    scene.add(glow2);

    // Partículas doradas flotantes
    const goldGeo = new THREE.BufferGeometry();
    const goldCount = 350;
    const goldPos = new Float32Array(goldCount * 3);
    for(let i = 0; i < goldCount * 3; i++) {
      goldPos[i] = (Math.random() - 0.5) * 20;
    }
    goldGeo.setAttribute('position', new THREE.BufferAttribute(goldPos, 3));
    const goldMat = new THREE.PointsMaterial({ color: 0xffcc00, size: 0.45, transparent: true, opacity: 0.8 });
    const goldParticles = new THREE.Points(goldGeo, goldMat);
    scene.add(goldParticles);

    // Mensajes para los planetas
    const mensajes = [
      "Te amo ❤️",
      "Eres mi universo, Jhoselin ✨",
      "Mi amor eterno Jhoselin 💖",
      "Jhoselin, eres la más hermosa 🌸",
      "Cada día contigo es un regalo 🎁",
      "Cada día contigo es un regalo 💝",
      "Te amo Jhoselin ❤️",
      "Eres mi lugar favorito en el mundo 🌎",
      "Mi universo entero comienza y termina contigo ✨",
      "Cada segundo a tu lado vale la pena ⏳💖",
      "Eres el sueño del que nunca quiero despertar 💭",
      "Contigo aprendí lo que realmente significa amar 🌹",
      "Eres mi coincidencia favorita de la vida 💫",
      "Si volviera a nacer, te elegiría mil veces más 💍",
      "Gracias por iluminar mi vida todos los días ☀️",
      "Amarte es la decisión más fácil de mi vida 💕",
      "Eres mi presente y quiero que seas mi futuro 🔮",
      "Eres mi sol en días nublados 🌤️",
      "Mi corazón es feliz desde que estás tú 😄💖",
      "Tu sonrisa es mi constelación favorita ⭐",
      "Siempre tú, en esta y en todas las vidas ♾️",
      "Eres mi paz en medio del caos 🕊️",
      "Un amor como el tuyo no se encuentra dos veces 💎",
      "Contigo todo es mejor 🌸",
      "Eres la razón de mis sonrisas espontáneas 😊",
      "Mi hogar eres tú 🏠❤️",
      "Amor eterno e infinito 💖",
      "Gracias por enseñarme a ver lo bonito de la vida 🌈",
      "Me haces querer ser una mejor persona cada día 🌟",
      "Tu amor es el regalo más valioso que tengo 🎁",
      "Con solo escucharte, se me arregla el día 🎧❤️",
      "Gracias por existir y cruzarte en mi camino 🛤️",
      "Cada detalle tuyo enamora a mi corazón 💘",
      "Eres la historia de amor que siempre quise escribir 📖",
      "No cambiaría ni un solo momento a tu lado ⌛",
      "Tu abrazo es el único lugar donde quiero estar 🫂",
      "Me haces sentir la persona más afortunada 🍀",
      "Prometo cuidarte y valorarte todos los días 🤝❤️",
      "Quiero construir mil recuerdos hermosos a tu lado 📸",
      "Mi destino es mucho más bonito si caminas a mi lado 🚶‍♂️🚶‍♀️",
      "Te amo hoy más que ayer y menos que mañana 📈❤️",
      "Quiero ser el motivo detrás de todas tus alegrías 🎉",
      "Sin importar el tiempo, siempre te elegiré ⏳",
      "Contigo el futuro no da miedo, da ilusión ✨",
      "Cuidaré de tu corazón como el tesoro más grande 🗝️💖",
      "Vamos a escribir juntos nuestra mejor historia ✍️",
      "Mi amor por ti crece a cada instante 🌷",
      "Eres la melodía más bonita de mi vida 🎶",
      "Tienes la sonrisa que ilumina toda mi noche 🌙",
      "Me enamoro de ti un poco más cada segundo 💓",
      "Eres mi pedacito de cielo en la Tierra ☁️✨",
      "A tu lado la vida sabe mucho mejor 🍭",
      "No necesito un mapa si mi destino eres tú 🗺️❤️",
      "Eres la combinación perfecta de amor y ternura 🧸",
      "Pensar en ti es mi pasatiempo favorito 💭❤️",
      "Te amo Jhoselin, más de lo que las palabras pueden explicar 💖"
    ];

    const planets = [];
    const labelsContainer = document.getElementById('labels-container');

    mensajes.forEach((texto, i) => {
      const radius = (i + 1) * 3.8 + 2.8;

      // Órbita
      const orbitGeo = new THREE.RingGeometry(radius - 0.03, radius + 0.03, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, opacity: 0.18, transparent: true });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      // Planeta rosado
      const planetGeo = new THREE.SphereGeometry(0.65, 16, 16);
      const planetMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x660022, roughness: 0.2 });
      const planet = new THREE.Mesh(planetGeo, planetMat);

      // Etiqueta del texto
      const label = document.createElement('div');
      label.className = 'label';
      label.innerText = texto;
      labelsContainer.appendChild(label);

      planets.push({
        mesh: planet,
        radius: radius,
        angle: (i * (Math.PI * 2 / mensajes.length)),
        speed: 0.0025 + (i * 0.0006),
        element: label
      });

      scene.add(planet);
    });

    const heartUI = document.getElementById('heart-ui');
    const sunWorldPos = new THREE.Vector3(0, 3.8, 0);

    function updateOverlay() {
      // Posición del corazón sobre el sol
      const vector = sunWorldPos.clone().project(camera);
      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
      heartUI.style.left = `${x + 110}px`;
      heartUI.style.top = `${y - 20}px`;

      // Posición de las etiquetas sobre los planetas
      planets.forEach(p => {
        const pPos = p.mesh.position.clone().add(new THREE.Vector3(0, 1.1, 0)).project(camera);
        const px = (pPos.x * 0.5 + 0.5) * window.innerWidth;
        const py = (-(pPos.y * 0.5) + 0.5) * window.innerHeight;
        p.element.style.left = `${px}px`;
        p.element.style.top = `${py}px`;
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotación suave del sol con la foto
      sun.rotation.y += 0.002;
      goldParticles.rotation.y += 0.001;

      planets.forEach(p => {
        p.angle += p.speed;
        p.mesh.position.x = Math.cos(p.angle) * p.radius;
        p.mesh.position.z = Math.sin(p.angle) * p.radius;
      });

      controls.update();
      updateOverlay();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
