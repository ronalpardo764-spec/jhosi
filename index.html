<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Universo de Jhoselin ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    #ui {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }
    #ui p {
      font-size: 14px;
      color: #ffeb3b;
      text-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
      margin: 0;
    }
    /* Contenedor para las etiquetas sobre los planetas */
    .label {
      position: absolute;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 8px #ff4081, 0 0 15px #ff4081;
      transform: translate(-50%, -100%);
      transition: opacity 0.3s;
    }
    .big-heart-text {
      position: absolute;
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 15px #ffe066, 0 0 30px #ff9900, 0 0 45px #ff0055;
      transform: translate(-50%, -50%);
      line-height: 1.2;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <p>(Gira y acerca la pantalla para explorar el universo de Jhoselin) ✨</p>
  </div>

  <div id="labels-container"></div>
  <div id="big-text" class="big-heart-text">¡TE AMO<br>JHOSELIN! ❤️</div>

  <script>
    // Configuración básica de la escena
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 18, 32);
    controls.update();

    // Luces para el brillo
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffaa00, 2, 100);
    scene.add(sunLight);

    // Fondo de estrellas
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starPositions = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 250;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // Sol Central con la Foto de ambos
    const textureLoader = new THREE.TextureLoader();
    // Carga la foto "foto.jpg" que subiste a GitHub
    const sunTexture = textureLoader.load('foto.jpg');

    const sunGeo = new THREE.SphereGeometry(3.5, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Halo de luz brillante alrededor del sol
    const glowGeo = new THREE.SphereGeometry(4.2, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.35 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);

    // Mensajes para Jhoselin
    const mensajes = [
      "Te amo ❤️",
      "Eres mi universo, Jhoselin ✨",
      "Mi amor eterno Jhoselin 💖",
      "Jhoselin, eres la más hermosa 🌸",
      "Cada día contigo es un regalo 🎁",
      "Siempre juntos 💍"
    ];

    const planets = [];
    const labelsContainer = document.getElementById('labels-container');

    mensajes.forEach((texto, i) => {
      const radius = (i + 1) * 4.2 + 3;

      // Órbita
      const orbitGeo = new THREE.RingGeometry(radius - 0.04, radius + 0.04, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, opacity: 0.15, transparent: true });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      // Planeta
      const planetGeo = new THREE.SphereGeometry(0.7, 16, 16);
      const planetMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3, emissive: 0x440011 });
      const planet = new THREE.Mesh(planetGeo, planetMat);

      // Crear elemento HTML para la etiqueta de texto
      const label = document.createElement('div');
      label.className = 'label';
      label.innerText = texto;
      labelsContainer.appendChild(label);

      planets.push({
        mesh: planet,
        radius: radius,
        angle: (i * (Math.PI * 2 / mensajes.length)),
        speed: 0.003 + (i * 0.0008),
        element: label
      });

      scene.add(planet);
    });

    // Posicionamiento del texto gigante flotante y etiquetas
    const bigTextDiv = document.getElementById('big-text');
    const sunWorldPos = new THREE.Vector3(0, 5, 0);

    function updateOverlay() {
      // Proyectar texto principal arriba del sol
      const vector = sunWorldPos.clone().project(camera);
      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
      bigTextDiv.style.left = `${x}px`;
      bigTextDiv.style.top = `${y}px`;

      // Actualizar posiciones de etiquetas de los planetas
      planets.forEach(p => {
        const pPos = p.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)).project(camera);
        const px = (pPos.x * 0.5 + 0.5) * window.innerWidth;
        const py = (-(pPos.y * 0.5) + 0.5) * window.innerHeight;
        p.element.style.left = `${px}px`;
        p.element.style.top = `${py}px`;
      });
    }

    // Animación continua
    function animate() {
      requestAnimationFrame(animate);

      // Rotación del sol
      sun.rotation.y += 0.002;

      // Movimiento de los planetas
      planets.forEach(p => {
        p.angle += p.speed;
        p.mesh.position.x = Math.cos(p.angle) * p.radius;
        p.mesh.position.z = Math.sin(p.angle) * p.radius;
      });

      controls.update();
      updateOverlay();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionar pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
