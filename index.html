<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eres el centro de mi universo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      color: white;
    }
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    #ui {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }
    h1 { margin: 0; font-size: 24px; color: #ffeb3b; }
    p { font-size: 14px; opacity: 0.8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h1>Eres el centro de mi universo ❤️</h1>
    <p>(Gira y acerca la pantalla para explorar los planetas)</p>
  </div>

  <script>
    // Configuración de la escena 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 20, 35);
    controls.update();

    // Luz
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    // Fondo de estrellas
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 2000;
    const starPositions = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 200;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // Sol central (TE AMO)
    const sunGeo = new THREE.SphereGeometry(3, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Lista de mensajes para los planetas
    const mensajes = [
      "Te amo ❤️",
      "Eres mi vida 💖",
      "Mi amor eterno 💕",
      "Siempre juntos 💍",
      "Mi lugar favorito eres tú 🌹",
      "Cada segundo vale la pena ✨",
      "Eres mi sueño hecho realidad 💫"
    ];

    const planets = [];

    // Crear órbitas y planetas con texto
    mensajes.forEach((texto, i) => {
      const radius = (i + 1) * 4 + 3;

      // Dibujar línea de órbita
      const orbitGeo = new THREE.RingGeometry(radius - 0.05, radius + 0.05, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, opacity: 0.2, transparent: true });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      // Crear planeta
      const planetGeo = new THREE.SphereGeometry(0.6, 16, 16);
      const planetMat = new THREE.MeshBasicMaterial({ color: 0xff4081 });
      const planet = new THREE.Mesh(planetGeo, planetMat);

      // Guardar datos del planeta
      planets.push({
        mesh: planet,
        radius: radius,
        angle: Math.random() * Math.PI * 2,
        speed: 0.005 + (i * 0.001)
      });

      scene.add(planet);
    });

    // Animación
    function animate() {
      requestAnimationFrame(animate);

      planets.forEach(p => {
        p.angle += p.speed;
        p.mesh.position.x = Math.cos(p.angle) * p.radius;
        p.mesh.position.z = Math.sin(p.angle) * p.radius;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
